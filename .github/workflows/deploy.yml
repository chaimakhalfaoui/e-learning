name: CI/CD Pipeline - Déploiement ISETSO E-learning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  S3_BUCKET: isetso-frontend-378174569462
  ECR_REPOSITORY_BACKEND: isetso-backend
  ECR_REPOSITORY_FRONTEND: isetso-frontend

jobs:

  # ========== JOB 1 : TEST BACKEND ==========
  test-backend:
    name: Tester le backend Node.js
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v3

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installer les dépendances backend
        run: npm install
        working-directory: ./Back

      - name: Exécuter les tests backend
        run: npm test || echo "No tests configured"
        working-directory: ./Back

  # ========== JOB 2 : TEST FRONTEND ==========
  test-frontend:
    name: Tester le frontend React
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v3

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installer les dépendances frontend
        run: npm install
        working-directory: ./front

      - name: Exécuter les tests frontend
        run: npm test || echo "No tests configured"
        working-directory: ./front

  # ========== JOB 3 : DÉPLOIEMENT FRONTEND SUR S3 ==========
  deploy-frontend:
    name: Déployer le frontend sur S3
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v3

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installer les dépendances
        run: npm install
        working-directory: ./front

      - name: Construire l'application React
        run: npm run build
        working-directory: ./front

      - name: Configurer AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Déployer sur S3
        run: |
          aws s3 sync ./front/build/ s3://${{ env.S3_BUCKET }} --delete

      - name: Récupérer l'URL du site
        run: |
          echo "Site disponible à : http://${{ env.S3_BUCKET }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"

  # ========== JOB 4 : BUILD ET PUSH DOCKER VERS ECR ==========
  build-and-push-ecr:
    name: Construire et pousser les images Docker vers ECR
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v3

      - name: Configurer AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Se connecter à Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login \
            --username AWS \
            --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Construire et pousser le backend
        run: |
          docker build -t ${{ env.ECR_REPOSITORY_BACKEND }} ./Back
          docker tag ${{ env.ECR_REPOSITORY_BACKEND }}:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_BACKEND }}:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_BACKEND }}:latest

      - name: Construire et pousser le frontend
        run: |
          docker build -t ${{ env.ECR_REPOSITORY_FRONTEND }} ./front
          docker tag ${{ env.ECR_REPOSITORY_FRONTEND }}:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_FRONTEND }}:latest

  # ========== JOB 5 : DÉPLOIEMENT BACKEND SUR ECS ==========
  deploy-backend:
    name: Déployer le backend sur ECS Fargate
    runs-on: ubuntu-latest
    needs: [build-and-push-ecr]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Configurer AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mettre à jour le service ECS
        run: |
          aws ecs update-service \
            --cluster isetso-cluster \
            --service isetso-backend-service \
            --force-new-deployment
