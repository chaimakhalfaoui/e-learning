name: CI/CD Pipeline - ISETSO E-learning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CI: false
  AWS_REGION: us-east-1
  S3_BUCKET: isetso-frontend-378174569462
  ECR_REPOSITORY_BACKEND: isetso-backend
  ECR_REPOSITORY_FRONTEND: isetso-frontend
  ECS_CLUSTER: isetso-cluster
  ECS_SERVICE: isetso-backend-task-service

jobs:

  # ============================================================
  # JOB 1 : TEST BACKEND
  # ============================================================
  test-backend:
    name: 🧪 Tester le backend Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
        working-directory: ./Back
      - run: npm test || echo "Aucun test configuré"
        working-directory: ./Back

  # ============================================================
  # JOB 2 : TEST FRONTEND
  # ============================================================
  test-frontend:
    name: 🧪 Tester le frontend React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
        working-directory: ./front
      - run: npm test || echo "Aucun test configuré"
        working-directory: ./front

  # ============================================================
  # JOB 3 : DÉPLOIEMENT FRONTEND SUR S3
  # ============================================================
  deploy-frontend:
    name: 🚀 Déployer le frontend sur S3
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
        working-directory: ./front
      - name: Build React
        run: npm run build
        working-directory: ./front
        env:
          CI: false
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to S3
        run: |
          aws s3 sync ./front/build/ s3://${{ env.S3_BUCKET }} --delete

  # ============================================================
  # JOB 4 : BUILD ET PUSH DOCKER VERS ECR
  # ============================================================
  build-and-push-ecr:
    name: 🐳 Build et push images Docker vers ECR
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login \
            --username AWS \
            --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
      - name: Build and push backend
        run: |
          docker build -t ${{ env.ECR_REPOSITORY_BACKEND }} ./Back
          docker tag ${{ env.ECR_REPOSITORY_BACKEND }}:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_BACKEND }}:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_BACKEND }}:latest
      - name: Build and push frontend
        run: |
          docker build -t ${{ env.ECR_REPOSITORY_FRONTEND }} ./front
          docker tag ${{ env.ECR_REPOSITORY_FRONTEND }}:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_FRONTEND }}:latest

  # ============================================================
  # JOB 5 : DÉPLOIEMENT BACKEND SUR ECS FARGATE
  # ============================================================
  deploy-backend:
    name: 🖥️ Déployer le backend sur ECS Fargate
    runs-on: ubuntu-latest
    needs: [build-and-push-ecr]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Register new task definition with env vars
        run: |
          aws ecs register-task-definition \
            --family isetso-backend-task \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu 256 \
            --memory 512 \
            --execution-role-arn arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/LabRole \
            --task-role-arn arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/LabRole \
            --container-definitions '[
              {
                "name": "backend",
                "image": "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/isetso-backend:latest",
                "portMappings": [{"containerPort": 8801, "protocol": "tcp"}],
                "environment": [
                  {"name": "NODE_ENV",    "value": "production"},
                  {"name": "PORT",        "value": "8801"},
                  {"name": "DB_HOST",     "value": "${{ secrets.RDS_HOST }}"},
                  {"name": "DB_USER",     "value": "${{ secrets.RDS_USER }}"},
                  {"name": "DB_PASSWORD", "value": "${{ secrets.RDS_PASSWORD }}"},
                  {"name": "DB_NAME",     "value": "${{ secrets.RDS_DATABASE }}"},
                  {"name": "JWT_SECRET",  "value": "${{ secrets.JWT_SECRET }}"},
                  {"name": "EMAIL_USER",  "value": "${{ secrets.EMAIL_USER }}"},
                  {"name": "EMAIL_PASS",  "value": "${{ secrets.EMAIL_PASS }}"}
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/isetso-backend",
                    "awslogs-region": "${{ env.AWS_REGION }}",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]'
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition isetso-backend-task \
            --force-new-deployment
      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
      - name: Test backend health
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER }} --query 'taskArns[0]' --output text)
          if [ -n "$TASK_ARN" ] && [ "$TASK_ARN" != "None" ]; then
            TASK_IP=$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --tasks ${TASK_ARN} \
              --query 'tasks[0].attachments[0].details[?name==`privateIPv4Address`].value' \
              --output text)
            echo "✅ Backend IP: ${TASK_IP}"
            curl -f http://${TASK_IP}:8801/health || echo "⚠️ Health check failed"
          else
            echo "⚠️ Aucune tâche trouvée"
          fi
